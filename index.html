<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Хаб</title>
<meta name="description" content="Задачі, сон і фотощоденник їжі в одному застосунку">
<meta name="theme-color" content="#181825">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Хаб">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// Тему застосовуємо до першого малювання, щоб не блимало світлим на темному.
(function(){
  var t;
  try { t = localStorage.getItem("hub_theme"); } catch(e){}
  if (t !== "latte" && t !== "mocha"){
    t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "latte" : "mocha";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>Хаб</h1>
        <span class="today" id="todayLabel"></span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="settingsBtn" title="Налаштування й копії" aria-label="Налаштування">⚙</button>
      <button class="icon-btn" id="themeBtn" title="Тема" aria-label="Змінити тему">◐</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview" aria-selected="true">Огляд</button>
      <button data-tab="tasks" aria-selected="false">Задачі</button>
      <button data-tab="sleep" aria-selected="false">Сон</button>
      <button data-tab="food" aria-selected="false">Їжа</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="card install-hint" id="installHint" hidden>
    <div>
      <b>Поставити на екран «Домівка»</b>
      <div class="muted" id="installText"></div>
    </div>
    <div class="wrap-row">
      <button class="btn primary" id="installBtn" hidden>Встановити</button>
      <button class="btn ghost" id="installDismiss">Пізніше</button>
    </div>
  </div>

  <!-- ── Огляд ─────────────────────────────────────────────────────────── -->
  <section id="tab-overview">
    <div id="overviewBanners"></div>
    <div class="grid">
      <div class="card">
        <h2>Сьогодні</h2>
        <div class="row" style="justify-content:space-between; align-items:flex-end">
          <div class="big" id="ovTasksCount">—</div>
          <div class="muted" id="ovTasksHint"></div>
        </div>
        <div id="ovTaskList" style="margin-top:12px"></div>
      </div>

      <div class="card">
        <h2>Активні стріки</h2>
        <div id="ovStreaks"></div>
      </div>

      <div class="card span-2">
        <h2>Сон за тиждень</h2>
        <div class="row" style="justify-content:space-between; align-items:flex-end; margin-bottom:10px">
          <div><span class="big" id="ovSleepAvg">—</span></div>
          <div class="muted" id="ovSleepHint"></div>
        </div>
        <div id="ovSleepChart"></div>
      </div>

      <div class="card">
        <h2 id="ovSweetTitle">Без солодкого</h2>
        <div class="row" style="justify-content:space-between; align-items:flex-end">
          <div class="big" id="ovSweetStreak">—<small>днів</small></div>
          <div class="muted" id="ovSweetHint"></div>
        </div>
        <div class="thumbs" id="ovFoodThumbs" style="margin-top:12px"></div>
      </div>
    </div>
  </section>

  <!-- ── Задачі ────────────────────────────────────────────────────────── -->
  <section id="tab-tasks" hidden>
    <div class="card" style="margin-bottom:14px">
      <div class="row" style="justify-content:space-between; margin-bottom:10px">
        <button class="btn ghost" id="dayPrev" aria-label="Попередній день">←</button>
        <div style="text-align:center">
          <div style="font-weight:700" id="taskDayLabel">—</div>
          <button class="btn ghost muted" id="dayToday" style="padding:2px 8px; font-size:12px">сьогодні</button>
        </div>
        <button class="btn ghost" id="dayNext" aria-label="Наступний день">→</button>
      </div>
      <div class="progress"><i id="dayProgress"></i></div>
      <div class="muted" id="dayProgressText" style="margin:6px 0 12px"></div>
      <div id="taskList"></div>
      <div class="wrap-row" id="hiddenTasks" style="margin-top:10px"></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <button class="btn ghost" id="addToggle" style="width:100%">＋ Нова задача</button>
      <div id="addForm" hidden style="margin-top:12px">
        <div class="wrap-row" style="align-items:flex-end">
          <div style="flex:2; min-width:190px">
            <label class="field" for="newTaskName">Назва</label>
            <input type="text" id="newTaskName" placeholder="Наприклад: зал" autocomplete="off">
          </div>
          <div style="flex:1; min-width:150px">
            <label class="field" for="newTaskRule">Повторення</label>
            <select id="newTaskRule">
              <option value="once">Одноразова</option>
              <option value="daily">Щодня</option>
              <option value="days">Дні тижня</option>
            </select>
          </div>
          <button class="btn primary" id="addTask">Додати</button>
        </div>
        <div id="newTaskDays" class="daychips" style="margin-top:10px" hidden></div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:8px">
        <h2 style="margin:0">Статистика</h2>
        <div class="wrap-row">
          <button class="btn ghost" data-hist-days="30" aria-pressed="true">Місяць</button>
          <button class="btn ghost" data-hist-days="182" aria-pressed="false">Пів року</button>
          <button class="btn ghost" data-hist-days="364" aria-pressed="false">Рік</button>
        </div>
      </div>

      <div class="wrap-row filter-row" id="histFilter" style="margin:12px 0"></div>
      <div class="stat-grid" id="histTiles"></div>

      <div id="histChart" style="margin-top:14px"></div>

      <h3 class="block-sub">Календар</h3>
      <div class="heat" id="taskHeat"></div>
      <button class="btn ghost" id="histMore" style="margin-top:14px; width:100%">Показати дати</button>
      <div id="taskLog" style="margin-top:12px" hidden></div>
    </div>
  </section>

  <!-- ── Сон ───────────────────────────────────────────────────────────── -->
  <section id="tab-sleep" hidden>
    <div id="sleepBanners"></div>

    <div class="card" style="margin-bottom:14px">
      <div class="wrap-row" style="gap:10px">
        <button class="btn big-action" id="btnBed">🌙 Ліг спати</button>
        <button class="btn big-action" id="btnWake">☀️ Прокинувся</button>
      </div>
      <div class="muted" id="sleepTonight" style="margin-top:10px"></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:8px">
        <h2 style="margin:0">Статистика</h2>
        <div class="wrap-row">
          <button class="btn ghost" data-sleep-days="30" aria-pressed="true">Місяць</button>
          <button class="btn ghost" data-sleep-days="182" aria-pressed="false">Пів року</button>
          <button class="btn ghost" data-sleep-days="364" aria-pressed="false">Рік</button>
        </div>
      </div>
      <div class="stat-grid" id="sleepTiles" style="margin-top:12px"></div>
      <div id="sleepChart" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2>Ночі</h2>
      <div id="sleepTable"></div>
    </div>
  </section>

  <!-- ── Їжа ───────────────────────────────────────────────────────────── -->
  <section id="tab-food" hidden>
    <div class="card shoot" style="margin-bottom:14px">
      <input type="file" id="foodCamera" accept="image/*" capture="environment" hidden>
      <input type="file" id="foodFile" accept="image/*" multiple hidden>
      <button class="btn primary big-action" id="foodShoot">📸 Сфотографувати їжу</button>
      <button class="btn" id="foodPick">Вибрати з галереї</button>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:8px">
        <h2 style="margin:0">Статистика</h2>
        <div class="wrap-row">
          <button class="btn ghost" data-food-days="30" aria-pressed="true">Місяць</button>
          <button class="btn ghost" data-food-days="182" aria-pressed="false">Пів року</button>
          <button class="btn ghost" data-food-days="364" aria-pressed="false">Рік</button>
        </div>
      </div>
      <div class="stat-grid" id="foodTiles" style="margin-top:12px"></div>
      <div id="foodChart" style="margin-top:14px"></div>

      <div class="row" style="justify-content:space-between; align-items:center; margin-top:16px">
        <h3 class="block-sub" style="margin:0">Категорії за період</h3>
        <button class="btn ghost" id="tagsBtn">Налаштувати</button>
      </div>
      <div class="tag-counts" id="foodTagStats" style="margin-top:10px"></div>
    </div>

    <div class="wrap-row filter-row" id="foodFilter" style="margin-bottom:14px"></div>
    <div id="foodFeed"></div>
  </section>

</main>

<dialog id="settingsDialog">
  <h2 class="dialog-title">Налаштування</h2>
  <div style="display:grid; gap:12px">
    <div>
      <label class="field" for="setGoal">Бажана норма сну (годин)</label>
      <input type="number" id="setGoal" min="4" max="12" step="0.25">
    </div>
    <div>
      <label class="field" for="setBedtime">Орієнтовний час лягати</label>
      <input type="time" id="setBedtime">
    </div>
    <div>
      <label class="field" for="setWarn">Скільки останніх ночей дивитись у попередженні</label>
      <input type="number" id="setWarn" min="2" max="14">
    </div>
    <label class="check-line">
      <input type="checkbox" id="setNotify">
      <span>Нагадувати про відбій сповіщенням</span>
    </label>
  </div>

  <h3 class="dialog-sub">Дані</h3>
  <div style="margin-bottom:10px">
    <label class="field" for="backupPhotos">Фото в копії</label>
    <select id="backupPhotos">
      <option value="3">За останні 3 місяці</option>
      <option value="12">За останній рік</option>
      <option value="all">Усі</option>
      <option value="none">Без фото</option>
    </select>
  </div>
  <div class="wrap-row">
    <button class="btn primary" id="shareBtn" hidden>Надіслати копію</button>
    <button class="btn" id="exportBtn">Зберегти копію</button>
    <button class="btn" id="importBtn">Відновити з копії</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <div class="muted" id="backupLine" style="margin-top:10px"></div>
  <div class="muted" id="usageLine" style="margin-top:4px"></div>
  <div class="muted" id="persistLine" style="margin-top:4px"></div>
  <button class="btn danger ghost" id="wipeBtn" style="margin-top:10px">Стерти все</button>

  <div class="wrap-row" style="justify-content:flex-end; margin-top:16px">
    <button class="btn primary" id="setClose">Готово</button>
  </div>
</dialog>

<dialog id="noteDialog">
  <h2 class="dialog-title" id="noteTitle">Нотатка</h2>
  <textarea id="noteText" rows="3" placeholder="Коротко: що це було, з ким, як почувався"></textarea>
  <div class="wrap-row" style="justify-content:flex-end; margin-top:14px">
    <button class="btn ghost" id="noteCancel">Скасувати</button>
    <button class="btn primary" id="noteSave">Зберегти</button>
  </div>
</dialog>

<dialog id="tagsDialog">
  <h2 class="dialog-title">Категорії їжі</h2>
  <div id="tagList"></div>

  <h3 class="dialog-sub">Нова категорія</h3>
  <div class="wrap-row" style="align-items:flex-end">
    <div style="width:76px">
      <label class="field" for="tagEmoji">Значок</label>
      <input type="text" id="tagEmoji" placeholder="🍕" maxlength="4">
    </div>
    <div style="flex:1; min-width:130px">
      <label class="field" for="tagName">Назва</label>
      <input type="text" id="tagName" placeholder="Наприклад: фастфуд" autocomplete="off">
    </div>
    <button class="btn primary" id="tagAdd">Додати</button>
  </div>
  <label class="check-line" style="margin-top:10px">
    <input type="checkbox" id="tagAvoid">
    <span>Уникаю</span>
  </label>

  <div class="wrap-row" style="justify-content:flex-end; margin-top:16px">
    <button class="btn primary" id="tagsClose">Готово</button>
  </div>
</dialog>

<dialog id="taskDialog">
  <h2 class="dialog-title">Задача</h2>
  <div style="display:grid; gap:12px">
    <div>
      <label class="field" for="editName">Назва</label>
      <input type="text" id="editName" autocomplete="off">
    </div>
    <div>
      <label class="field" for="editRule">Повторення</label>
      <select id="editRule">
        <option value="once">Одноразова</option>
        <option value="daily">Щодня</option>
        <option value="days">Дні тижня</option>
      </select>
    </div>
    <div id="editDays" class="daychips" hidden></div>
    <div>
      <label class="field" for="editNote">Примітка</label>
      <input type="text" id="editNote" autocomplete="off" placeholder="необов'язково">
    </div>
    <label class="check-line">
      <input type="checkbox" id="editActive">
      <span>Активна</span>
    </label>
    <div>
      <label class="field">Порядок у списку</label>
      <div class="wrap-row">
        <button class="btn ghost" id="editUp">↑ Вище</button>
        <button class="btn ghost" id="editDown">↓ Нижче</button>
      </div>
    </div>
  </div>
  <div class="wrap-row" style="justify-content:space-between; margin-top:16px">
    <button class="btn danger ghost" id="editDelete">Видалити</button>
    <span class="wrap-row">
      <button class="btn ghost" id="editCancel">Скасувати</button>
      <button class="btn primary" id="editSave">Зберегти</button>
    </span>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script src="store.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
